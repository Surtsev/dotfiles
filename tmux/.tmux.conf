# ============================================
# ОСНОВНЫЕ НАСТРОЙКИ
# ============================================

# Установка префиксной клавиши (Ctrl+a вместо Ctrl+b)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Включение поддержки мыши
set -g mouse on

# Увеличение истории прокрутки
set -g history-limit 10000

# Нумерация окон с 1 (вместо 0)
set -g base-index 1
setw -g pane-base-index 1

# Перезагрузка конфига (Ctrl+a r)
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ============================================
# VIM-ПОДОБНАЯ НАВИГАЦИЯ ПО ОКНАМ (Windows)
# ============================================

# h - предыдущее окно
bind h previous-window

# l - следующее окно
bind l next-window

# j - следующее окно (альтернатива)
bind j next-window

# k - предыдущее окно (альтернатива)
bind k previous-window

# ============================================
# УПРАВЛЕНИЕ ОКНАМИ
# ============================================

# Создать новое окно
bind c new-window

# Закрыть текущее окно
bind & confirm-before -p "Close window #W? (y/n)" kill-window

# Переименовать текущее окно (ИСПРАВЛЕНО)
bind , command-prompt -I "#W" "rename-window '%%'"

# Выбрать окно по номеру
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9

# Список всех окон
bind w list-windows

# Переместить текущее окно влево/вправо
bind < swap-window -t -1
bind > swap-window -t +1

# ============================================
# УПРАВЛЕНИЕ ПАНЕЛЯМИ (Panes)
# ============================================

# Разделение панелей
bind | split-window -h
bind - split-window -v


# Закрыть текущую панель
bind x confirm-before -p "Close pane? (y/n)" kill-pane

# Изменить размер панелей (префикс + Shift + h/j/k/l)
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Сделать панели одинакового размера
bind = select-layout even-horizontal
bind _ select-layout even-vertical

# ============================================
# КОПИРОВАНИЕ (Vim режим)
# ============================================

# Включить режим копирования (как в Vim)
set -g mode-keys vi

# Настройка буфера обмена
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection
bind ] paste-buffer

# Копирование в системный буфер (если установлен xclip)
bind C-p run "tmux save-buffer - | xclip -selection clipboard"

# ============================================
# ВИЗУАЛЬНЫЕ НАСТРОЙКИ (ИСПРАВЛЕНО)
# ============================================

# Статусная строка
set -g status-position top
set -g status-style bg=default,fg=red

# Цвет активного окна
set -g window-status-current-style bg=red,fg=colour250

# Формат отображения окон
set-window-option -g window-status-format "#I #W"
set-window-option -g window-status-current-format "#I #W"

# Отображение времени в статусе
set -g status-right "%H:%M %d-%b-%y"

# Включение активности в окне
set-window-option -g monitor-activity on
set -g visual-activity on

# ============================================
# ПОЛЕЗНЫЕ ДОПОЛНЕНИЯ
# ============================================

# Быстрый перезапуск оболочки в текущей панели
bind R send-keys -R \; clear-history \; display "Reset pane"

# Поиск по выводу (как / в less)
bind / copy-mode \; send-keys '/'

# Обновить все сессии
bind I source-file ~/.tmux.conf \; display "Reloaded all sessions!"
